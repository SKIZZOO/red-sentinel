[build]
  publish = "dashboard"

# Proxy the browser's same-origin API calls to the Red Sentinel server.
# The Red Sentinel API is exposed through TCP port 27015.
[[redirects]]
  from = "/api/*"
  to = "http://187.13.27.138:27015/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/*"
  to = "http://187.13.27.138:27015/oauth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
