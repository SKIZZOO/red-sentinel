[build]
  publish = "dashboard"

# Proxy the browser's same-origin API calls to the Red Sentinel server.
# Update the IP here if the ISP changes the public IPv4 address.
[[redirects]]
  from = "/api/*"
  to = "http://187.13.27.138:2556/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/*"
  to = "http://187.13.27.138:2556/oauth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
